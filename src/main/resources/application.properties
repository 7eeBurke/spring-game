spring.application.name=spring-game

# Local development database (see compose.yaml). These are local-only values, not secrets.
# Override with SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5433/spring_game
spring.datasource.username=spring_game
spring.datasource.password=spring_game

# Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
